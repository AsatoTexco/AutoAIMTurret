services:
  autoaim:
    build: .
    container_name: autoaim-turret
    restart: unless-stopped
    ports:
      - "5000:5000"
    devices:
      - "/dev/dri:/dev/dri"
    privileged: true
    shm_size: "1gb"
    environment:
      - TURRET_URL=${TURRET_URL:-http://192.168.100.5}
      - STREAM_URL=${STREAM_URL:-http://192.168.100.5:81/stream}
      - AUTOAIM_BACKEND=${AUTOAIM_BACKEND:-auto}
      - AUTOAIM_CPU_THREADS=${AUTOAIM_CPU_THREADS:-4}
      - AUTOAIM_MAX_FPS=${AUTOAIM_MAX_FPS:-20}
